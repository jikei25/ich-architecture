# Single origin for the browser, like the reverse proxy in the architecture:
#   /                 OHIF viewer (static app)
#   /dcm4chee-arc/    PACS: DICOMweb (QIDO/WADO/STOW), REST API and admin UI
#   /triage/          AI results service + triage worklist
# The architecture checks the Keycloak token here; the PoC leaves auth out.
server {
  listen 80;
  client_max_body_size 200m;

  location /dcm4chee-arc/ {
    proxy_pass http://arc:8080;
    proxy_set_header Host $http_host;
    proxy_read_timeout 300s;
  }

  location /triage/ {
    proxy_pass http://triage:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;          # Server-Sent Events must not be buffered
    proxy_read_timeout 1h;
    add_header Cache-Control "no-cache" always;   # revalidate, so a rebuilt PoC shows at once
  }

  location / {
    proxy_pass http://ohif:80;
    proxy_set_header Host $http_host;
    # Inject the AI panel into OHIF's page (PoC stand-in for an OHIF extension).
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</body>' '<script src="/triage/ohif-ai.js"></script></body>';
  }
}
