name: medical-ai-pacs

x-logging: &logging
  driver: json-file
  options: {max-size: "50m", max-file: "5"}

services:
  # Archive configuration (DICOM configuration schema in LDAP). Not published: only the archive reads it.
  ldap:
    image: dcm4che/slapd-dcm4chee:2.6.15-35.2
    restart: unless-stopped
    environment:
      LDAP_ROOTPASS: ${LDAP_ROOTPASS:?run generate-env.sh}
      LDAP_CONFIGPASS: ${LDAP_CONFIGPASS:?run generate-env.sh}
      ARCHIVE_DEVICE_NAME: dcm4chee-arc
      ARCHIVE_HOST: arc
      STORAGE_DIR: /storage/fs1
    volumes:
      - ${DATA_ROOT:?run generate-env.sh}/medical-ai-openldap/data:/var/lib/openldap/openldap-data
      - ${DATA_ROOT}/medical-ai-openldap/config:/etc/openldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b '' -s base >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  # Runs on every "up": applies ldap/staging.ldif.in (storage on SeaweedFS, accepted callers, export to
  # the gateway, AE AI_RESULTS) and reloads the archive when it is already running.
  ldap-setup:
    image: dcm4che/slapd-dcm4chee:2.6.15-35.2
    restart: "no"
    depends_on:
      ldap: {condition: service_healthy}
    entrypoint: ["sh", "/setup/apply.sh"]
    environment:
      LDAP_ROOTPASS: ${LDAP_ROOTPASS}
      PACS_S3_ACCESS_KEY: ${PACS_S3_ACCESS_KEY:?run generate-env.sh}
      PACS_S3_SECRET_KEY: ${PACS_S3_SECRET_KEY:?run generate-env.sh}
      STORAGE_HOST: ${STORAGE_HOST:?run generate-env.sh}
      S3_PORT: ${S3_PORT:-8333}
      GATEWAY_HOST: ${GATEWAY_HOST:?run generate-env.sh}
      ORTHANC_DICOM_PORT: ${ORTHANC_DICOM_PORT:-4242}
      PACS_ACCEPTED_CALLING_AETS: ${PACS_ACCEPTED_CALLING_AETS:?run generate-env.sh}
    volumes:
      - ./ldap:/setup:ro
    logging: *logging

  arc:
    image: dcm4che/dcm4chee-arc-psql:5.35.2
    restart: unless-stopped
    depends_on:
      ldap: {condition: service_healthy}
      ldap-setup: {condition: service_completed_successfully}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${DICOM_PORT:-11112}:11112"
      - "${BIND_ADDRESS:-0.0.0.0}:${HL7_PORT:-2575}:2575"
      - "${BIND_ADDRESS:-0.0.0.0}:${AI_RESULTS_PORT:-11113}:11113"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LDAP_ROOTPASS: ${LDAP_ROOTPASS}
      POSTGRES_HOST: ${DATABASE_HOST:?run generate-env.sh}
      POSTGRES_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: ${PACS_DB_PASSWORD:?run generate-env.sh}
      WILDFLY_CHOWN: /storage
      WILDFLY_WAIT_FOR: ldap:389 ${DATABASE_HOST}:${DB_PORT:-5432}
      JBOSS_JAVA_SIZING: -Xms1g -Xmx${ARC_JAVA_HEAP:-4g} -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m
    volumes:
      - ${DATA_ROOT}/medical-ai-dcm4chee/wildfly:/opt/wildfly/standalone
      - ${DATA_ROOT}/medical-ai-dcm4chee/storage:/storage
    logging: *logging

  # OHIF viewer; its nginx also proxies /dcm4chee-arc/ (DICOMweb, REST, archive UI) to the archive.
  ohif:
    image: ohif/app@sha256:56ac100b87b38c3ca839d214cb813e6ef8be689e853e6a939699400376b00aff
    restart: unless-stopped
    depends_on: [arc]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    environment:
      PORT: "8080"
    # The image entrypoint compresses app-config.js in place, so the file is copied in rather than mounted.
    entrypoint: ["sh", "-c", "cp /config/app-config.js /usr/share/nginx/html/app-config.js && exec /usr/src/entrypoint.sh nginx -g 'daemon off;'"]
    volumes:
      - ./ohif/app-config.js:/config/app-config.js:ro
      - ./ohif/default.conf.template:/usr/src/default.conf.template:ro
    logging: *logging
