name: medical-ai-gateway

x-logging: &logging
  driver: json-file
  options: {max-size: "50m", max-file: "5"}

services:
  # Orthanc gateway: index in PostgreSQL (database orthanc), files in SeaweedFS (bucket orthanc).
  # The image enables each plugin whose configuration section is present.
  # The local build adds the AI bridge plugin (plugin/ai_bridge.py) to the orthancteam image.
  orthanc:
    build: .
    image: medical-ai/orthanc-ai:26.9.1
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ORTHANC_DICOM_PORT:-4242}:4242"
      - "${BIND_ADDRESS:-0.0.0.0}:${ORTHANC_HTTP_PORT:-8042}:8042"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ORTHANC__NAME: ich-gateway
      ORTHANC__DICOM_AET: ORTHANC
      ORTHANC__STABLE_AGE: "10"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"ai": "${ORTHANC_AI_PASSWORD:?run generate-env.sh}"}'
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_MODALITIES: '{"pacs": {"AET": "AI_RESULTS", "Host": "${PACS_HOST:?run generate-env.sh}", "Port": ${AI_RESULTS_PORT:-11113}}}'
      ORTHANC__POSTGRESQL__HOST: ${DATABASE_HOST:?run generate-env.sh}
      ORTHANC__POSTGRESQL__PORT: ${DB_PORT:-5432}
      ORTHANC__POSTGRESQL__DATABASE: orthanc
      ORTHANC__POSTGRESQL__USERNAME: orthanc
      ORTHANC__POSTGRESQL__PASSWORD: ${ORTHANC_DB_PASSWORD:?run generate-env.sh}
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"
      ORTHANC__AWS_S3_STORAGE__BUCKET_NAME: orthanc
      ORTHANC__AWS_S3_STORAGE__REGION: us-east-1
      ORTHANC__AWS_S3_STORAGE__ENDPOINT: http://${STORAGE_HOST:?run generate-env.sh}:${S3_PORT:-8333}
      ORTHANC__AWS_S3_STORAGE__ACCESS_KEY: ${GATEWAY_S3_ACCESS_KEY:?run generate-env.sh}
      ORTHANC__AWS_S3_STORAGE__SECRET_KEY: ${GATEWAY_S3_SECRET_KEY:?run generate-env.sh}
      ORTHANC__AWS_S3_STORAGE__VIRTUAL_ADDRESSING: "false"
      ORTHANC__PYTHON_SCRIPT: /plugin/ai_bridge.py
      AI_SEGMENT_URL: ${AI_SEGMENT_URL:-}
    volumes:
      - ${DATA_ROOT:?run generate-env.sh}/medical-ai-orthanc/db:/var/lib/orthanc/db
    logging: *logging
